<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيوهات فضاء ٢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&family=Changa:wght@400;600;800&family=El+Messiri:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Lalezar&family=Lemonada:wght@500;700&family=Reem+Kufi:wght@400;600;700&family=Rakkas&family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #0c0c0e; color: #eee; font-family: 'Cairo', sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .gal { max-width: 1400px; margin: 0 auto; padding: 32px 16px 80px; }
  .gal h1 { font: 400 46px 'Lalezar'; }
  .gal > p { color: #b8b8c0; line-height: 1.8; margin-top: 4px; max-width: 940px; }
  .covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; margin-top: 26px; }
  .cover { border-radius: 22px; overflow: hidden; background: #18181c; border: 2px solid transparent; display: flex; flex-direction: column; }
  .cover .art { height: 300px; position: relative; overflow: hidden; cursor: pointer; }
  .cover .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .cover .fam { align-self: flex-start; font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 10px; background: #2a2a31; color: #ffd23f; }
  .cover h2 { font-size: 22px; }
  .cover p { font-size: 13.5px; color: #b8b8c0; line-height: 1.75; }
  .cover .mo { font-size: 12.5px; color: #d9d9e0; background: #222228; border-radius: 10px; padding: 8px 10px; line-height: 1.7; }
  .cover .mo b { color: #ffd23f; }
  .cover .acts { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
  .cover .open { flex: 1; background: #ffd23f; color: #111; font-weight: 900; border-radius: 12px; padding: 11px; font-size: 15px; transition: transform 140ms var(--ease-out); }
  .cover .open:active { transform: scale(.97); }

  .app { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
  .app.on { display: flex; }
  .device { width: min(430px, 100vw); height: min(900px, 100dvh); position: relative; overflow: hidden; border-radius: 34px; box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateZ(0); }
  .app.full .device { width: 100vw; height: 100dvh; border-radius: 0; }
  @media (max-width: 500px) { .device { border-radius: 0; height: 100dvh; } }
  .chrome { position: absolute; top: 10px; left: 10px; z-index: 90; display: flex; gap: 6px; }
  .chrome button { width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 17px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.2); }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
  .screen::-webkit-scrollbar, .hs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .ph { background-size: cover; background-position: center; }
  .chips { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 9px 12px; }
  .chips button { flex: none; white-space: nowrap; transition: background-color 180ms ease, color 180ms ease; }
  .cart { position: sticky; bottom: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; padding: 13px 16px calc(13px + env(safe-area-inset-bottom)); font-weight: 700; }
  .odo { direction: ltr; display: inline-flex; height: 1.25em; overflow: hidden; vertical-align: bottom; }
  .odo span { display: block; transition: transform 380ms var(--ease-out); }
  .odo span i { display: block; height: 1.25em; line-height: 1.25em; font-style: normal; }
  .toast { position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%) translateY(16px); opacity: 0; z-index: 85; background: #111; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .add { transition: transform 120ms var(--ease-out); flex: none; }
  .add:active { transform: scale(.9); }
  .hs { display: flex; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
  .rv { opacity: 0; transform: translateY(14px); transition: opacity 400ms var(--ease-out), transform 400ms var(--ease-out); transition-delay: var(--d, 0ms); }
  .rv.in { opacity: 1; transform: none; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinr { to { transform: rotate(-360deg); } }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes fl { from { transform: scaleY(1); opacity: .9; } to { transform: scaleY(1.18); opacity: 1; } }
  @keyframes tw { 50% { opacity: .35; } }

  /* ===== shared deep-space look: black, starfield, neon glass, mono labels ===== */
  [class*="m-sp-"] {
    background:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent 70%),
      radial-gradient(1px 1px at 130px 90px, rgba(255,255,255,.7), transparent 70%),
      radial-gradient(1.5px 1.5px at 70px 160px, #b9c8ff, transparent 70%),
      radial-gradient(1px 1px at 175px 200px, #fff, transparent 70%),
      radial-gradient(2px 2px at 100px 60px, rgba(138,91,255,.9), transparent 70%),
      radial-gradient(ellipse at 85% 0, rgba(138,91,255,.22), transparent 55%),
      radial-gradient(ellipse at 0 55%, rgba(0,212,255,.12), transparent 50%),
      #000;
    background-size: 200px 220px, 200px 220px, 200px 220px, 200px 220px, 230px 260px, 100% 100%, 100% 100%;
    color: #fff; font-family: 'Space Grotesk', 'IBM Plex Sans Arabic', sans-serif;
  }
  [class*="m-sp-"] .ml { font: 500 11px 'Geist Mono', 'IBM Plex Mono', 'IBM Plex Sans Arabic'; letter-spacing: .18em; text-transform: uppercase; color: rgba(214,226,255,.85); }
  [class*="m-sp-"] .top { padding: 60px 18px 14px; position: relative; }
  [class*="m-sp-"] .top h1 { font: 700 34px 'Space Grotesk', 'IBM Plex Sans Arabic'; letter-spacing: -.01em; margin-top: 6px; }
  [class*="m-sp-"] .top p { color: rgba(214,226,255,.7); font-size: 13.5px; margin-top: 2px; }
  [class*="m-sp-"] .chips { background: rgba(0,0,0,.72); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.08); }
  [class*="m-sp-"] .chips button { font: 500 11.5px 'Geist Mono', 'IBM Plex Sans Arabic'; letter-spacing: .08em; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 6px 12px 6px 10px; color: rgba(255,255,255,.78); display: inline-flex; gap: 7px; align-items: center; }
  [class*="m-sp-"] .chips button::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  [class*="m-sp-"] .chips button.on { border-color: var(--c); color: #fff; box-shadow: 0 0 16px -3px var(--c), inset 0 0 12px -6px var(--c); }
  [class*="m-sp-"] .glass { background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.015)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); border-radius: 14px; box-shadow: 0 0 26px -8px var(--c), inset 0 0 22px -14px var(--c); }
  [class*="m-sp-"] .num { font: 500 11px 'Geist Mono'; color: var(--c); letter-spacing: .1em; }
  [class*="m-sp-"] .pr { font: 500 12.5px 'Geist Mono', 'IBM Plex Sans Arabic'; color: #fff; }
  [class*="m-sp-"] .gadd { font: 500 11.5px 'Geist Mono', 'IBM Plex Sans Arabic'; letter-spacing: .12em; color: var(--c); text-transform: uppercase; }
  [class*="m-sp-"] .cart { background: rgba(6,8,18,.92); border-top: 1px solid rgba(255,255,255,.12); font-family: 'Geist Mono', 'IBM Plex Sans Arabic'; backdrop-filter: blur(10px); }
  [class*="m-sp-"] .cart .sum { color: #00d4ff; }
  [class*="m-sp-"] .sl { display: flex; justify-content: space-between; align-items: baseline; padding: 0 18px 10px; }
  [class*="m-sp-"] .sl b { font: 700 20px 'Space Grotesk', 'IBM Plex Sans Arabic'; }
  [class*="m-sp-"] .rail { position: fixed; right: 12px; top: 32%; height: 36%; width: 1px; background: rgba(255,255,255,.18); z-index: 25; pointer-events: none; }
  [class*="m-sp-"] .rail i { position: absolute; left: -3px; top: 0; width: 7px; height: 7px; border-radius: 50%; background: #4d7cff; box-shadow: 0 0 10px #4d7cff; }
  [class*="m-sp-"] .orb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d8e6ff, #3b6cff 38%, #0b1a4a 75%); box-shadow: 0 0 40px rgba(77,124,255,.55); }


  /* 1. WARP — dishes rush toward you: the row in the middle of the screen is full size, the rest are far away */
  .m-sp-warp .streaks { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: repeating-conic-gradient(from 0deg at 50% 45%, rgba(185,200,255,.13) 0 .6deg, transparent .6deg 7deg); -webkit-mask: radial-gradient(circle at 50% 45%, transparent 12%, #000 60%); mask: radial-gradient(circle at 50% 45%, transparent 12%, #000 60%); }
  .m-sp-warp .top, .m-sp-warp section, .m-sp-warp .cart { position: relative; z-index: 1; }
  .m-sp-warp section { padding: 14px 14px 6px; }
  .m-sp-warp .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .m-sp-warp .wp { padding: 8px; transform-origin: 50% 50%; will-change: transform; }
  .m-sp-warp .wp .ph { height: 112px; border-radius: 10px; }
  .m-sp-warp .wp b { display: block; font: 700 14.5px 'Space Grotesk', 'IBM Plex Sans Arabic'; margin-top: 7px; }
  .m-sp-warp .wp .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }

  /* 2. SPACE STATION — a spine with a module docked for every section, joined by tubes */
  .m-sp-stn .body { position: relative; padding: 0 14px 10px; }
  .m-sp-stn .body::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 14px; margin-left: -7px; background: repeating-linear-gradient(#2b3140 0 6px, #59627a 6px 8px); border-inline: 1px solid #6b7590; }
  .m-sp-stn section { position: relative; }
  .m-sp-stn .pod { position: relative; border-radius: 34px; padding: 14px 12px 14px; background: linear-gradient(90deg, #12151d, #262b38 18%, #11141b 50%, #262b38 82%, #12151d); border: 1px solid #4b5262; box-shadow: 0 0 0 4px #0b0d12, 0 0 0 5px color-mix(in srgb, var(--c) 70%, transparent), 0 0 30px -8px var(--c); }
  .m-sp-stn .pod .sl { padding: 0 6px 10px; }
  .m-sp-stn .hatch { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .m-sp-stn .bay { display: grid; grid-template-columns: 58px 1fr; gap: 8px; align-items: center; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 6px; }
  .m-sp-stn .bay .ph { height: 58px; border-radius: 50%; border: 2px solid #8a93a5; }
  .m-sp-stn .bay b { display: block; font-size: 12.5px; line-height: 1.25; }
  .m-sp-stn .bay .add { margin-top: 3px; }
  .m-sp-stn .tube { position: relative; height: 34px; }
  .m-sp-stn .tube::before, .m-sp-stn .tube::after { content: ''; position: absolute; top: 6px; width: 34%; height: 22px; background: linear-gradient(#1b4a8f, #3a7bd5 40%, #1b4a8f); background-size: 100% 100%; border: 1px solid #5a8fe0; }
  .m-sp-stn .tube::before { right: 4%; background-image: linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(255,255,255,.35) 0), linear-gradient(#1b4a8f, #3a7bd5 40%, #1b4a8f); background-size: 14% 100%, 100% 100%; }
  .m-sp-stn .tube::after { left: 4%; background-image: linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(255,255,255,.35) 0), linear-gradient(#1b4a8f, #3a7bd5 40%, #1b4a8f); background-size: 14% 100%, 100% 100%; }

  /* 3. MISSION PATCHES — every dish an embroidered round patch, three to a row */
  .m-sp-patch section { padding: 14px 10px 8px; }
  .m-sp-patch .flag { margin: 0 6px 12px; padding: 7px 14px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, transparent), transparent); border-inline-start: 3px solid var(--c); }
  .m-sp-patch .flag b { font: 700 19px 'Space Grotesk', 'IBM Plex Sans Arabic'; }
  .m-sp-patch .patches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; }
  .m-sp-patch .pt { text-align: center; }
  .m-sp-patch .disc { position: relative; width: 92%; margin: 0 auto; aspect-ratio: 1; border-radius: 50%; padding: 9%; background: #0b1020; box-shadow: 0 0 0 3px var(--c), 0 0 0 6px #0b1020, 0 0 0 7px rgba(255,255,255,.5), 0 0 22px -2px var(--c); }
  .m-sp-patch .disc::after { content: ''; position: absolute; inset: 4%; border-radius: 50%; border: 1.5px dashed rgba(255,255,255,.55); pointer-events: none; }
  .m-sp-patch .disc .ph { width: 100%; height: 100%; border-radius: 50%; }
  .m-sp-patch .disc .tag { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--c); color: #000; font: 700 9px 'Geist Mono'; letter-spacing: .12em; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
  .m-sp-patch .pt b { display: block; font-size: 13px; line-height: 1.25; margin-top: 12px; }
  .m-sp-patch .pt .add { margin-top: 3px; border: 1px solid var(--c); border-radius: 999px; padding: 2px 9px; }
  .m-sp-patch .pt.on .disc { box-shadow: 0 0 0 3px var(--c), 0 0 0 6px var(--c), 0 0 0 7px #fff, 0 0 30px 4px var(--c); }

  /* 4. CARGO BAY — every section a ribbed container, every dish a crate inside it */
  .m-sp-cargo section { padding: 14px 12px 10px; }
  .m-sp-cargo .box { border: 2px solid color-mix(in srgb, var(--c) 70%, #000); border-radius: 6px; background: repeating-linear-gradient(90deg, #14171e 0 10px, #1d212b 10px 13px); }
  .m-sp-cargo .haz { height: 12px; background: repeating-linear-gradient(-45deg, var(--c) 0 10px, #000 10px 20px); }
  .m-sp-cargo .stencil { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 12px; }
  .m-sp-cargo .stencil b { font: 700 20px 'Space Grotesk', 'IBM Plex Sans Arabic'; letter-spacing: .02em; }
  .m-sp-cargo .crates { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px 12px; }
  .m-sp-cargo .crate { position: relative; background: linear-gradient(#2a2f3a, #1a1e26); border: 1px solid #4b5262; border-radius: 4px; padding: 8px; }
  .m-sp-cargo .crate::before { content: ''; position: absolute; inset: 3px; pointer-events: none; background: radial-gradient(circle, #8a93a5 1.6px, transparent 2px) 0 0 / 100% 100%, radial-gradient(circle at 4px 4px, #8a93a5 1.6px, transparent 2px), radial-gradient(circle at calc(100% - 4px) 4px, #8a93a5 1.6px, transparent 2px), radial-gradient(circle at 4px calc(100% - 4px), #8a93a5 1.6px, transparent 2px), radial-gradient(circle at calc(100% - 4px) calc(100% - 4px), #8a93a5 1.6px, transparent 2px); background-size: 0 0, 100% 100%, 100% 100%, 100% 100%, 100% 100%; background-repeat: no-repeat; }
  .m-sp-cargo .crate .ph { height: 92px; border-radius: 2px; border: 2px solid #0b0d12; }
  .m-sp-cargo .crate .id { display: flex; justify-content: space-between; font: 500 10px 'Geist Mono'; color: var(--c); margin-top: 6px; letter-spacing: .1em; }
  .m-sp-cargo .crate b { display: block; font: 700 14px 'IBM Plex Sans Arabic'; margin-top: 2px; }
  .m-sp-cargo .bar { height: 14px; margin-top: 6px; background: repeating-linear-gradient(90deg, #d6e2ff 0 1px, transparent 1px 3px, #d6e2ff 3px 5px, transparent 5px 6px, #d6e2ff 6px 7px, transparent 7px 10px); opacity: .55; }
  .m-sp-cargo .crate .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .m-sp-cargo .crate .stamp { position: absolute; top: 34px; left: 50%; transform: translateX(-50%) rotate(-12deg); border: 2px solid #22e6a8; color: #22e6a8; font: 700 13px 'Geist Mono', 'IBM Plex Sans Arabic'; padding: 2px 8px; background: rgba(0,0,0,.6); letter-spacing: .12em; }

  /* 5. COUNTDOWN — the menu is a launch countdown: dishes are T-minus steps on one line */
  .m-sp-count .tl { position: relative; padding: 4px 12px 10px; }
  .m-sp-count .tl::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: linear-gradient(#00d4ff, #8a5bff, #ff3ea5, #ffb020); box-shadow: 0 0 10px rgba(0,212,255,.6); }
  .m-sp-count section { position: relative; padding-bottom: 10px; }
  .m-sp-count .mk { position: relative; z-index: 1; margin: 10px auto 12px; width: max-content; padding: 4px 14px; border: 1px solid var(--c); border-radius: 999px; background: #000; display: flex; gap: 10px; align-items: baseline; box-shadow: 0 0 16px -4px var(--c); }
  .m-sp-count .mk b { font: 700 16px 'Space Grotesk', 'IBM Plex Sans Arabic'; }
  .m-sp-count .ev { position: relative; width: 47%; display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: center; padding: 7px; }
  .m-sp-count .ev.r { margin-inline-start: auto; }
  .m-sp-count .ev + .ev { margin-top: -34px; }
  .m-sp-count .ev::after { content: ''; position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); inset-inline-end: calc(-6.4% - 5px); }
  .m-sp-count .ev.r::after { inset-inline-end: auto; inset-inline-start: calc(-6.4% - 5px); }
  .m-sp-count .ev .ph { height: 62px; border-radius: 8px; }
  .m-sp-count .t { display: block; font: 700 15px 'Geist Mono'; color: var(--c); letter-spacing: .04em; direction: ltr; text-align: start; }
  .m-sp-count .ev b { display: block; font-size: 13px; line-height: 1.25; }
  .m-sp-count .ev .add { margin-top: 2px; }
  .m-sp-count .lift { text-align: center; padding: 14px 0 24px; position: relative; z-index: 1; }
  .m-sp-count .lift b { display: inline-block; background: #000; padding: 6px 16px; border: 1px solid #ffb020; border-radius: 999px; font: 700 16px 'Geist Mono', 'IBM Plex Sans Arabic'; color: #ffb020; box-shadow: 0 0 22px -4px #ffb020; }

  /* 6. WORMHOLE — two walls of dishes that bend into a tunnel above and below the middle of the screen */
  .m-sp-worm .rings { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: repeating-radial-gradient(ellipse at 50% 50%, transparent 0 34px, rgba(138,91,255,.22) 35px 36px, transparent 37px 52px); -webkit-mask: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%); mask: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 75%); }
  .m-sp-worm .top, .m-sp-worm section, .m-sp-worm .cart { position: relative; z-index: 1; }
  .m-sp-worm section { padding: 14px 12px 6px; }
  .m-sp-worm .walls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 22px; perspective: 520px; }
  .m-sp-worm .wc { padding: 8px; will-change: transform; }
  .m-sp-worm .wc .ph { height: 104px; border-radius: 10px; }
  .m-sp-worm .wc b { display: block; font: 700 14px 'Space Grotesk', 'IBM Plex Sans Arabic'; margin-top: 6px; }
  .m-sp-worm .wc .ft { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }

  /* 7. SATELLITE — every section a satellite whose two solar wings are made of dish cells */
  .m-sp-sat section { padding: 14px 8px 12px; }
  .m-sp-sat .craft { display: grid; grid-template-columns: 1fr 44px 1fr; align-items: center; gap: 0; }
  .m-sp-sat .wing { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; padding: 4px; background: #0b1630; border: 2px solid #7f8aa3; }
  .m-sp-sat .cell { position: relative; aspect-ratio: .78; background: #0e2350; overflow: hidden; }
  .m-sp-sat .cell .ph { position: absolute; inset: 0 0 34% 0; }
  .m-sp-sat .cell .ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 0 calc(50% - .5px), rgba(120,170,255,.45) 0 calc(50% + .5px), transparent 0), linear-gradient(90deg, transparent 0 calc(50% - .5px), rgba(120,170,255,.45) 0 calc(50% + .5px), transparent 0), linear-gradient(135deg, rgba(90,140,255,.25), transparent 55%); }
  .m-sp-sat .cell .info { position: absolute; inset: auto 0 0 0; height: 34%; padding: 3px 4px; display: flex; flex-direction: column; justify-content: center; }
  .m-sp-sat .cell b { font-size: 11px; line-height: 1.15; }
  .m-sp-sat .cell .row2 { display: flex; justify-content: space-between; align-items: center; }
  .m-sp-sat .cell .pr { font-size: 10px; }
  .m-sp-sat .cell .add { width: 20px; height: 20px; border-radius: 4px; background: var(--c); color: #000; font-weight: 800; font-size: 13px; line-height: 1; }

// distance of an element from the top of the scrolling screen, whatever its offset parent
const topOf = el => el.getBoundingClientRect().top - screen.getBoundingClientRect().top + screen.scrollTop;

  const secs = [...screen.querySelectorAll('[data-sec]')];

  cleanups.push(() => screen.removeEventListener('scroll', run));
  run();
}

function wire(key) {

  const W = WIRE[key] || {};

    const to = e.target.closest('[data-to]');
    if (to) return (W.go || jumpY)(to.dataset.to);
    W.click && W.click(e);

  if (!W.noSpy) spyY(id => mark('.chips [data-to]', id));

}


const ease = 'cubic-bezier(0.23, 1, 0.32, 1)';

}
const pulse = (el, k = 1.12) => { if (!reduce) el.animate([{ transform: 'scale(1)' }, { transform: `scale(${k})` }, { transform: 'scale(1)' }], { duration: 380, easing: ease }); };
// run fn(card, t, side) on scroll, where t is 0 in the middle of the screen and 1 at its edges
function depth(sel, fn) {
  if (reduce) return;
  const cards = [...screen.querySelectorAll(sel)]; let raf = 0;
  const run = () => {
    raf = 0;
    const sr = screen.getBoundingClientRect(), cy = sr.top + sr.height / 2, cx = sr.left + sr.width / 2;
    cards.forEach(c => { const b = c.getBoundingClientRect(), y = b.top + b.height / 2; fn(c, Math.min(1, Math.abs(y - cy) / (sr.height / 2)), Math.sign(y - cy), b.left + b.width / 2 < cx ? -1 : 1); });
  };
  const on = () => { if (!raf) raf = requestAnimationFrame(run); };
  screen.addEventListener('scroll', on, { passive: true }); cleanups.push(() => { screen.removeEventListener('scroll', on); cancelAnimationFrame(raf); }); run();
}
const WIRE = {
  'sp-warp': {

    },
  },
  'sp-count': { added(a) { pulse(a.closest('.ev'), 1.05); } },
  'sp-worm': {
    // cards above and below the middle fold away like the walls of a tunnel
    init() { depth('.wc', (c, t, v, side) => { c.style.transformOrigin = side < 0 ? '0 50%' : '100% 50%'; c.style.transform = `rotateY(${(side * 48 * t * t).toFixed(1)}deg) rotateX(${(-v * 18 * t * t).toFixed(1)}deg) scale(${(1 - .2 * t).toFixed(3)})`; }); },
    added(a) { pulse(a.closest('.wc'), 1.05); },
  },
  'sp-sat': { added(a) { pulse(a.closest('.cell'), 1.08); } },
  'sp-moon': { added(a) { a.closest('.mn').classList.add('full'); } },
};
Object.values(WIRE).forEach(W => { const i = W.init; W.init = () => { railOn(); i && i(); }; });
// ---------- solo: one style, full size, for the Studio showroom ----------
(() => {
  const key = new URL(location.href).searchParams.get('style');
  if (!key || !STYLES.some(s => s.key === key)) return;
  document.documentElement.classList.add('solo');
  closeApp = () => {};
  open(key);
  app.classList.add('full');
})();
</script>
</body>
