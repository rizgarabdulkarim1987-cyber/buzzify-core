<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيوهات بالثيمات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;900&family=Changa:wght@300;500;700;800&family=El+Messiri:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&family=Lalezar&family=Reem+Kufi:wght@400;600;700&family=Lemonada:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #0c0c0e; color: #eee; font-family: 'Cairo', sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .gal { max-width: 1400px; margin: 0 auto; padding: 32px 16px 80px; }
  .gal h1 { font: 400 46px 'Lalezar'; }
  .gal > p { color: #b8b8c0; line-height: 1.8; margin-top: 4px; max-width: 920px; }
  .covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; margin-top: 26px; }
  .cover { border-radius: 22px; overflow: hidden; background: #18181c; border: 2px solid transparent; display: flex; flex-direction: column; }
  .cover .art { height: 300px; position: relative; overflow: hidden; cursor: pointer; }
  .cover .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .cover .fam { align-self: flex-start; font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 10px; background: #2a2a31; color: #ffd23f; }
  .cover h2 { font-size: 22px; }
  .cover p { font-size: 13.5px; color: #b8b8c0; line-height: 1.75; }
  .cover .mo { font-size: 12.5px; color: #d9d9e0; background: #222228; border-radius: 10px; padding: 8px 10px; line-height: 1.7; }
  .cover .mo b { color: #ffd23f; }
  .cover .sk { font-size: 11px; color: #9a9aa3; direction: ltr; text-align: right; }
  .cover .acts { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
  .cover .open { flex: 1; background: #ffd23f; color: #111; font-weight: 900; border-radius: 12px; padding: 11px; font-size: 15px; transition: transform 140ms var(--ease-out); }
  .cover .open:active { transform: scale(.97); }

  .app { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
  .app.on { display: flex; }
  .device { width: min(430px, 100vw); height: min(900px, 100dvh); position: relative; overflow: hidden; border-radius: 34px; box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateZ(0); }
  .app.full .device { width: 100vw; height: 100dvh; border-radius: 0; }
  @media (max-width: 500px) { .device { border-radius: 0; height: 100dvh; } }
  .chrome { position: absolute; top: 10px; left: 10px; z-index: 90; display: flex; gap: 6px; }
  .chrome button { width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 17px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.2); }
  .chrome .rp { width: auto; padding: 0 12px; border-radius: 20px; font: 700 12px 'Cairo'; }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
  .ph { background-size: cover; background-position: center; }
  .tabs { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 56px 10px 12px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; white-space: nowrap; transition: background-color 200ms ease, color 200ms ease; }
  .cart { position: sticky; bottom: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; padding: 13px 16px calc(13px + env(safe-area-inset-bottom)); font-weight: 700; }
  .cart .ic { display: inline-block; }
  .odo { direction: ltr; display: inline-flex; height: 1.25em; overflow: hidden; vertical-align: bottom; }
  .odo span { display: block; transition: transform 380ms var(--ease-out); }
  .odo span i { display: block; height: 1.25em; line-height: 1.25em; font-style: normal; }
  .toast { position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%) translateY(16px); opacity: 0; z-index: 85; background: #111; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .add { transition: transform 120ms var(--ease-out); }
  .add:active { transform: scale(.9); }
  .rv { opacity: 0; transform: translateY(18px); transition: opacity 420ms var(--ease-out), transform 420ms var(--ease-out); transition-delay: var(--d, 0ms); }
  .rv.in { opacity: 1; transform: none; }
  .flyer { position: absolute; z-index: 88; top: 0; left: 0; pointer-events: none; font-size: 34px; }

  /* =====================================================================
     1. KURDISH — jajim weave, Newroz fire, the halparke dance line
     ===================================================================== */
  .m-kurd { --r: #b3202a; --y: #e9a51b; --g: #2f7d4a; --b: #23306b; background: #f6ead2; color: #2a1810; font-family: 'Reem Kufi'; }
  .m-kurd .kilim { height: 22px; background: linear-gradient(135deg, var(--r) 25%, transparent 25%) -11px 0/22px 22px, linear-gradient(225deg, var(--r) 25%, transparent 25%) -11px 0/22px 22px, linear-gradient(315deg, var(--g) 25%, transparent 25%) 0 0/22px 22px, linear-gradient(45deg, var(--g) 25%, transparent 25%) 0 0/22px 22px, var(--y); }
  .m-kurd .kilim.thin { height: 12px; background-size: 12px 12px; }
  .m-kurd .hd { position: relative; height: 230px; background: linear-gradient(#2b1a3d, #8a3b2a 70%, #e9a51b); overflow: hidden; color: #fff; text-align: center; }
  .m-kurd .hd h1 { position: relative; z-index: 3; font: 400 40px 'Lalezar'; padding-top: 22px; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .m-kurd .hd p { position: relative; z-index: 3; font-size: 14px; }
  .m-kurd .mtn { position: absolute; bottom: 0; left: 0; width: 100%; height: 120px; }
  .m-kurd .fire { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 70px; height: 90px; z-index: 2; }
  .m-kurd .fire i { position: absolute; bottom: 0; left: 50%; border-radius: 0 50% 50% 50%; animation: flame 1.1s ease-in-out infinite alternate; }
  .m-kurd .fire i:nth-child(1) { width: 56px; height: 56px; margin-left: -28px; background: radial-gradient(circle at 70% 70%, #ffdc6b, #ff7b1c 45%, #c2241b 80%); }
  .m-kurd .fire i:nth-child(2) { width: 36px; height: 36px; margin-left: -26px; bottom: 4px; background: radial-gradient(circle at 70% 70%, #fff2b0, #ffb02e 70%); animation-duration: .8s; animation-delay: -.3s; }
  .m-kurd .fire i:nth-child(3) { width: 28px; height: 28px; margin-left: 0; bottom: 6px; background: radial-gradient(circle at 70% 70%, #fff2b0, #ff9a1f 70%); animation-duration: .9s; animation-delay: -.6s; }
  @keyframes flame { 0% { transform: rotate(45deg) scale(1); } 50% { transform: rotate(40deg) scale(1.1, 1.18); } 100% { transform: rotate(50deg) scale(.94, 1.06); } }
  .m-kurd .spark { position: absolute; bottom: 70px; width: 4px; height: 4px; border-radius: 50%; background: #ffd36b; animation: spark 2.4s ease-out infinite; z-index: 2; }
  @keyframes spark { from { transform: translate(0,0); opacity: 1; } to { transform: translate(var(--sx), -120px); opacity: 0; } }
  .m-kurd .tabs { background: rgba(246,234,210,.95); }
  .m-kurd .tabs button { font: 600 13px 'Reem Kufi'; padding: 5px 12px; border: 2px solid var(--r); border-radius: 4px; color: var(--r); }
  .m-kurd .tabs button.on { background: var(--r); color: #fff; }
  .m-kurd .dance { height: 64px; overflow: hidden; display: flex; justify-content: center; gap: 2px; padding-top: 6px; }
  .m-kurd .dance svg { width: 34px; height: 56px; flex: none; animation: dabke 1.2s ease-in-out infinite; }
  @keyframes dabke { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(-5px) rotate(-3deg); } 50% { transform: translateY(0); } 75% { transform: translateY(-3px) rotate(3deg); } }
  .m-kurd section { padding: 14px 12px 6px; }
  .m-kurd section > h3 { text-align: center; font: 400 30px 'Lalezar'; color: var(--r); margin-bottom: 10px; }
  .m-kurd .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
  .m-kurd .it { background: #fffaf0; padding: 6px; position: relative; border: 3px solid transparent; border-image: repeating-linear-gradient(45deg, var(--r) 0 6px, var(--y) 6px 12px, var(--g) 12px 18px, var(--b) 18px 24px) 6; }
  .m-kurd .it .ph { aspect-ratio: 1; }
  .m-kurd .it .nm { font-weight: 700; font-size: 15px; margin-top: 6px; }
  .m-kurd .it .row { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--r); }
  .m-kurd .it::after { content: ''; position: absolute; bottom: -14px; left: 12%; right: 12%; height: 10px; background: repeating-linear-gradient(90deg, var(--r) 0 3px, transparent 3px 8px); }
  .m-kurd .add { width: 30px; height: 30px; border-radius: 50%; background: var(--g); color: #fff; font-weight: 700; font-size: 17px; }
  .m-kurd .cart { background: var(--r); color: #fff; }

  /* =====================================================================
     2. BAGHDAD SHANASHEEL — wooden lattice shutters open on each dish
     ===================================================================== */
  .m-shn { --w: #5b3417; --w2: #7a4a24; --t: #1f8a8a; background: #efe2c8; color: #3a210d; font-family: 'Aref Ruqaa'; }
  .m-shn .lattice { background: radial-gradient(circle, transparent 38%, var(--w) 40% 52%, transparent 54%) 0 0/16px 16px, linear-gradient(var(--w2), var(--w2)); }
  .m-shn .hd { position: relative; text-align: center; padding: 26px 16px 70px; background: linear-gradient(#0d3b5a, #1f6d8a); color: #f6e7c8; overflow: hidden; }
  .m-shn .hd h1 { font-size: 40px; line-height: 1.1; position: relative; z-index: 2; }
  .m-shn .hd p { font: 400 14px 'Amiri'; position: relative; z-index: 2; }
  .m-shn .lamp { position: absolute; top: 0; width: 2px; height: 50px; background: #c9a24a; transform-origin: top center; animation: sway 3.4s ease-in-out infinite alternate; }
  .m-shn .lamp::after { content: ''; position: absolute; bottom: -24px; left: -11px; width: 24px; height: 28px; border-radius: 6px 6px 12px 12px; background: radial-gradient(circle at 50% 60%, #ffe8a3, #e9a51b 60%, #8a5a12); box-shadow: 0 0 22px rgba(255,210,120,.7); }
  @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  .m-shn .river { position: absolute; bottom: 0; left: 0; width: 200%; height: 46px; animation: river 7s linear infinite; }
  @keyframes river { to { transform: translateX(50%); } }
  .m-shn .tabs { background: var(--w); }
  .m-shn .tabs button { font: 400 15px 'Aref Ruqaa'; padding: 4px 12px; color: #f0d9b0; border-radius: 3px; }
  .m-shn .tabs button.on { background: var(--t); color: #fff; }
  .m-shn section { padding: 22px 12px 6px; }
  .m-shn section > h3 { text-align: center; font-size: 28px; margin-bottom: 12px; }
  .m-shn .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
  .m-shn .it { background: var(--w); padding: 8px 8px 10px; border-radius: 70px 70px 6px 6px; box-shadow: 0 8px 16px rgba(58,33,13,.25); }
  .m-shn .win { position: relative; aspect-ratio: 1; border-radius: 62px 62px 3px 3px; overflow: hidden; perspective: 600px; border: 3px solid #c9a24a; }
  .m-shn .win .ph { position: absolute; inset: 0; }
  .m-shn .sh { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 2; transition: transform 800ms var(--ease-out); transition-delay: var(--d, 0ms); box-shadow: inset 0 0 0 2px #3a210d; }
  .m-shn .sh.a { right: 0; transform-origin: right center; } .m-shn .sh.b { left: 0; transform-origin: left center; }
  .m-shn .it.in .sh.a { transform: rotateY(-108deg); } .m-shn .it.in .sh.b { transform: rotateY(108deg); }
  .m-shn .it .nm { color: #f6e7c8; font-size: 17px; margin-top: 7px; text-align: center; }
  .m-shn .it .row { display: flex; justify-content: space-between; align-items: center; color: #e9c27a; font: 700 13px 'Cairo'; }
  .m-shn .add { width: 28px; height: 28px; border-radius: 50%; background: var(--t); color: #fff; font-weight: 700; }
  .m-shn .cart { background: var(--t); color: #fff; font-family: 'Cairo'; }

  /* =====================================================================
     3. BABYLON — Ishtar gate tiles, gold rosettes, the gate opens
     ===================================================================== */
  .m-bab { --bl: #1d4b9b; --gd: #e1b64a; background-color: #163a7a; background-image: linear-gradient(rgba(0,0,0,.25) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.25) 2px, transparent 2px), linear-gradient(90deg, rgba(0,0,0,.25) 2px, transparent 2px); background-size: 100% 22px, 44px 44px, 44px 44px; background-position: 0 0, 0 0, 22px 22px; color: #f7e7b8; font-family: 'Reem Kufi'; }
  .m-bab .ros { display: flex; justify-content: space-around; padding: 8px 0; background: var(--bl); border-top: 3px solid var(--gd); border-bottom: 3px solid var(--gd); }
  .m-bab .ros i { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle, #fff3c4 0 18%, transparent 20%), repeating-conic-gradient(var(--gd) 0 15deg, transparent 15deg 45deg); animation: rot 12s linear infinite; }
  .m-bab .ros i:nth-child(even) { animation-direction: reverse; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .m-bab .hd { text-align: center; padding: 22px 16px 12px; }
  .m-bab .hd small { letter-spacing: 6px; color: var(--gd); font-size: 11px; }
  .m-bab .hd h1 { font-size: 38px; font-weight: 700; color: #fff3c4; text-shadow: 0 3px 0 #0b2350; }
  .m-bab .gate { position: relative; margin: 6px 22px 0; aspect-ratio: 1/0.8; border-radius: 50% 50% 0 0 / 40% 40% 0 0; border: 6px solid var(--gd); overflow: hidden; perspective: 900px; box-shadow: 0 0 0 6px var(--bl), 0 0 0 9px var(--gd); }
  .m-bab .gate .ph { position: absolute; inset: 0; }
  .m-bab .door { position: absolute; top: 0; bottom: 0; width: 50%; background-color: var(--bl); background-image: radial-gradient(circle, var(--gd) 0 3px, transparent 4px); background-size: 22px 22px; border: 2px solid var(--gd); z-index: 2; }
  .m-bab .door.a { right: 0; transform-origin: right; } .m-bab .door.b { left: 0; transform-origin: left; }
  .m-bab .gate-cap { text-align: center; margin: 12px 0 4px; }
  .m-bab .gate-cap b { font-size: 22px; color: #fff3c4; }
  .m-bab .tabs { background: rgba(14,40,90,.95); border-bottom: 3px solid var(--gd); }
  .m-bab .tabs button { font: 600 13px 'Reem Kufi'; padding: 5px 12px; border: 1.5px solid var(--gd); color: var(--gd); }
  .m-bab .tabs button.on { background: var(--gd); color: var(--bl); }
  .m-bab section { padding: 22px 12px 6px; }
  .m-bab section > h3 { text-align: center; font-size: 26px; color: #fff3c4; margin-bottom: 12px; }
  .m-bab .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
  .m-bab .it { background: var(--bl); border: 2px solid var(--gd); padding: 6px 6px 8px; border-radius: 60px 60px 0 0; }
  .m-bab .it .ph { aspect-ratio: 1; border-radius: 54px 54px 0 0; }
  .m-bab .it .nm { font-weight: 700; font-size: 15px; margin-top: 6px; text-align: center; }
  .m-bab .it .row { display: flex; justify-content: space-between; align-items: center; color: var(--gd); font-weight: 700; }
  .m-bab .rvt { opacity: 0; transform: translateY(-24px) scale(.96); transition: opacity 500ms var(--ease-out), transform 500ms var(--ease-out); transition-delay: var(--d, 0ms); }
  .m-bab .rvt.in { opacity: 1; transform: none; }
  .m-bab .add { width: 28px; height: 28px; background: var(--gd); color: var(--bl); font-weight: 800; }
  .m-bab .cart { background: var(--gd); color: var(--bl); }

  /* =====================================================================
     4. SPACE — starfield, portholes, warp jumps, a rocket to your basket
     ===================================================================== */
  .m-spc { background: radial-gradient(ellipse at 70% 10%, #2a1660, #07051a 55%, #020108); color: #e8e6ff; font-family: 'Changa'; }
  .m-spc .stars { position: absolute; top: 0; left: 0; width: 2px; height: 2px; border-radius: 50%; background: transparent; }
  .m-spc .layer { position: absolute; inset: 0; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateY(0); } to { transform: translateY(900px); } }
  .m-spc .hd { position: relative; text-align: center; padding: 24px 16px 6px; }
  .m-spc .hd small { font: 600 10px 'IBM Plex Mono'; letter-spacing: 4px; color: #9b8cff; }
  .m-spc .hd h1 { font-weight: 800; font-size: 34px; }
  .m-spc .orbit { position: relative; width: 74%; aspect-ratio: 1; margin: 14px auto 0; }
  .m-spc .orbit .ph { position: absolute; inset: 12%; border-radius: 50%; box-shadow: 0 0 0 4px #1b1440, 0 0 60px rgba(155,140,255,.35); }
  .m-spc .ring { position: absolute; inset: -2%; border-radius: 50%; border: 1.5px dashed rgba(155,140,255,.5); animation: rot 14s linear infinite; }
  .m-spc .ring::after { content: ''; position: absolute; top: -9px; left: 50%; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #b9b3d9 50%, #5a5480); }
  .m-spc .hero-cap { text-align: center; margin-top: 10px; }
  .m-spc .hero-cap b { font-size: 22px; }
  .m-spc .tabs { background: rgba(7,5,26,.8); backdrop-filter: blur(8px); }
  .m-spc .tabs button { font: 500 13px 'Changa'; padding: 5px 12px; border-radius: 30px; border: 1px solid rgba(155,140,255,.5); color: #c9c2ff; }
  .m-spc .tabs button.on { background: #9b8cff; color: #07051a; }
  .m-spc section { position: relative; padding: 22px 12px 6px; }
  .m-spc section > h3 { font-weight: 800; font-size: 24px; margin-bottom: 12px; }
  .m-spc section > h3 small { font: 400 10px 'IBM Plex Mono'; color: #9b8cff; margin-right: 6px; }
  .m-spc .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 12px; }
  .m-spc .it { text-align: center; }
  .m-spc .port { position: relative; aspect-ratio: 1; border-radius: 50%; padding: 9px; background: conic-gradient(#8d8aa8, #e2e0f2, #6d6a88, #c9c7dc, #8d8aa8); }
  .m-spc .port .ph { width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 18px rgba(0,0,0,.6); }
  .m-spc .port::after { content: ''; position: absolute; inset: 9px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,.28), transparent 45%); }
  .m-spc .it .nm { font-weight: 700; font-size: 15px; margin-top: 8px; }
  .m-spc .it .row { display: flex; justify-content: space-between; align-items: center; color: #9b8cff; font-weight: 700; }
  .m-spc .add { width: 30px; height: 30px; border-radius: 50%; background: #9b8cff; color: #07051a; font-weight: 800; font-size: 17px; }
  .warp { position: absolute; inset: -50%; z-index: 70; pointer-events: none; background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.9) 0 .4deg, transparent .4deg 6deg); -webkit-mask: radial-gradient(circle, transparent 0 8%, #000 30%); mask: radial-gradient(circle, transparent 0 8%, #000 30%); }
  .m-spc .cart { background: #9b8cff; color: #07051a; }

  /* =====================================================================
     5. PARIS BISTRO — striped awning, string lights, menu cards
     ===================================================================== */
  .m-par { background: #f4ecdf; color: #1f2a44; font-family: 'El Messiri'; }
  .m-par .lat { font-family: 'Bodoni Moda'; direction: ltr; unicode-bidi: isolate; }
  .m-par .awn { position: relative; height: 70px; background: repeating-linear-gradient(90deg, #c8102e 0 32px, #fff 32px 64px); transform-origin: top center; animation: awn 4s ease-in-out infinite alternate; z-index: 3; }
  .m-par .awn::after { content: ''; position: absolute; bottom: -16px; left: 0; right: 0; height: 16px; background: radial-gradient(circle at 16px 0, #c8102e 15px, transparent 16px) 0 0/64px 16px, radial-gradient(circle at 48px 0, #fff 15px, transparent 16px) 0 0/64px 16px; }
  @keyframes awn { from { transform: perspective(400px) rotateX(0deg); } to { transform: perspective(400px) rotateX(-8deg); } }
  .m-par .lights { display: flex; justify-content: space-around; padding: 20px 6px 0; position: relative; }
  .m-par .lights::before { content: ''; position: absolute; top: 12px; left: 0; right: 0; height: 18px; border-bottom: 1.5px solid #3a3a3a; border-radius: 0 0 50% 50%; }
  .m-par .lights i { width: 9px; height: 13px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; background: #ffd27a; box-shadow: 0 0 10px #ffc54a; animation: tw 2s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: 1; } to { opacity: .45; } }
  .m-par .hd { text-align: center; padding: 14px 16px 10px; }
  .m-par .hd small { font: italic 400 14px 'Bodoni Moda'; color: #c8102e; }

// ---------- app ----------
const app = document.getElementById('app'), device = document.getElementById('device'), screen = document.getElementById('screen'), toastEl = document.getElementById('toast');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let count = 0, total = 0, current = null, cleanups = [];
const fromAr = s => Number(s.replace(/[٠-٩]/g, d => DIG.indexOf(d)).replace(/[^\d]/g, ''));
const fmt = n => toAr(n.toLocaleString('en-US')).replace(/,/g, '٬');

function open(key) {
  cleanups.forEach(f => f()); cleanups = [];
  device.querySelectorAll('.fx,.warp,.flyer').forEach(x => x.remove());
  const s = STYLES.find(x => x.key === key);
  count = 0; total = 0; current = key;
  screen.onscroll = null;
  screen.className = `screen m-${key}`;
  screen.innerHTML = s.render();
  screen.scrollTo({ top: 0, behavior: 'instant' });
  app.classList.add('on'); document.body.style.overflow = 'hidden';
  wire(key);
}
function closeApp() { app.classList.remove('on', 'full'); document.body.style.overflow = ''; cleanups.forEach(f => f()); cleanups = []; }
document.getElementById('close').onclick = closeApp;
document.getElementById('full').onclick = () => app.classList.toggle('full');
document.getElementById('replay').onclick = () => current && open(current);
app.addEventListener('click', e => { if (e.target === app) closeApp(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeApp(); });
document.addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) open(o.dataset.open); });
function toast(t) { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('on'), 1300); }
function setOdo(n) { const d = String(Math.min(n, 99)).padStart(2, '0'); screen.querySelectorAll('.cart .odo > span').forEach((c, i) => c.style.transform = `translateY(-${Number(d[i]) * 1.25}em)`); }

function addToCart(btn) {
  const card = btn.closest('.it, .dish, .feat, .gate-cap, .hero-cap, .hcap') || btn.parentElement;
  const m = card.textContent.match(/[٠-٩]{1,3}٬[٠-٩]{3}/);
  count++; total += m ? fromAr(m[0]) : 0;
  setOdo(count);
  screen.querySelector('.cart .sum').textContent = `${fmt(total)} د.ع ←`;
  const nm = card.querySelector('.nm, .ln, b');
  if (current !== 'spc') toast(`انضاف ${nm ? nm.childNodes[0].textContent.trim() : ''} ✓`);
  return card;
}

function wire(key) {
  setOdo(0);
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); if (key === 'prn') printPct(e.target); } }), { root: screen, threshold: .15 });
  screen.querySelectorAll('.rv,.rvt,.rvp,.rvb,[data-rv]').forEach(el => io.observe(el));
  cleanups.push(() => io.disconnect());
  screen.onclick = e => { const b = e.target.closest('.add'); if (!b) return; e.stopPropagation(); const card = addToCart(b); if (key === 'spc') rocket(card); };

  if (key === 'book') return buildBook(screen, false);

  const nav = screen.querySelector('.tabs'), btns = [...nav.querySelectorAll('button')];
  const jump = id => { const sec = screen.querySelector(`[data-sec="${id}"]`); screen.scrollTo({ top: sec.offsetTop - nav.offsetHeight + 2, behavior: key === 'spc' ? 'instant' : 'smooth' }); };
  btns.forEach(b => b.addEventListener('click', () => key === 'spc' ? warp(() => jump(b.dataset.to)) : jump(b.dataset.to)));
  screen.onscroll = () => {
    let cur = MENU[0].id;
    for (const s of MENU) { const el = screen.querySelector(`[data-sec="${s.id}"]`); if (el.offsetTop - nav.offsetHeight - 80 <= screen.scrollTop) cur = s.id; }
    btns.forEach(b => b.classList.toggle('on', b.dataset.to === cur));
    const on = btns.find(b => b.classList.contains('on')); nav.scrollTo({ left: on.offsetLeft - nav.clientWidth / 2 + on.clientWidth / 2, behavior: 'smooth' });
  };

  if (key === 'bab') gate();
  if (key === 'spc') stars();
  if (key === 'win') { snow(); frost(); }
  if (key === 'sum') palm();
}

// fixed overlay layer inside the phone
function layer(html) { const f = document.createElement('div'); f.className = 'fx'; f.innerHTML = html; device.insertBefore(f, device.querySelector('.toast')); return f; }

// Babylon: the gate opens once (rare entrance)
function gate() {
  if (reduce) { screen.querySelectorAll('.door').forEach(d => d.remove()); return; }
  const o = { duration: 1300, delay: 400, easing: 'cubic-bezier(0.77, 0, 0.175, 1)', fill: 'forwards' };
  screen.querySelector('.door.a').animate([{ transform: 'perspective(900px) rotateY(0)' }, { transform: 'perspective(900px) rotateY(-100deg)' }], o);
  screen.querySelector('.door.b').animate([{ transform: 'perspective(900px) rotateY(0)' }, { transform: 'perspective(900px) rotateY(100deg)' }], o);
}

// Space: three star layers drifting at different speeds
function stars() {
  const dots = (n, size, alpha) => Array.from({ length: n }, () => `${Math.random() * 430 | 0}px ${Math.random() * 900 | 0}px 0 ${size}px rgba(255,255,255,${alpha})`).join(',');
  const L = (n, s, a, dur) => `<div class="layer" style="animation-duration:${dur}s"><div class="stars" style="box-shadow:${dots(n, s, a)}"></div><div class="stars" style="top:-900px;box-shadow:${dots(n, s, a)}"></div></div>`;
  const f = layer(L(60, 0, .5, 60) + L(30, .6, .8, 34) + L(12, 1.2, 1, 20));
  f.classList.add('m-spc'); f.style.background = 'none'; f.style.zIndex = 1;
}
function warp(done) {
  if (reduce) return done();
  const w = document.createElement('div'); w.className = 'warp'; device.appendChild(w);
  w.animate([{ transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1.2)', opacity: 1, offset: .5 }, { transform: 'scale(2.4)', opacity: 0 }], { duration: 520, easing: 'cubic-bezier(0.77, 0, 0.175, 1)' }).onfinish = () => w.remove();
  setTimeout(done, 260);
}
function rocket(card) {
  if (reduce) return;
  const ph = card.querySelector('.ph') || card; const d = device.getBoundingClientRect(), a = ph.getBoundingClientRect(), ic = screen.querySelector('.cart .ic').getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'flyer'; f.textContent = '🚀'; device.appendChild(f);
  const x0 = a.left - d.left + a.width / 2 - 17, y0 = a.top - d.top + a.height / 2 - 17, x1 = ic.left - d.left, y1 = ic.top - d.top - 6;
  f.animate([{ transform: `translate(${x0}px,${y0}px) rotate(-45deg) scale(1.2)` }, { transform: `translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 140}px) rotate(-90deg) scale(1)`, offset: .5 }, { transform: `translate(${x1}px,${y1}px) rotate(-170deg) scale(.5)`, opacity: .8 }], { duration: 700, easing: 'cubic-bezier(0.77, 0, 0.175, 1)', fill: 'forwards' }).onfinish = () => {
    f.remove(); screen.querySelector('.cart .ic').animate([{ transform: 'scale(1)' }, { transform: 'scale(1.4) rotate(-15deg)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    toast('انضاف للشحنة 🚀');
  };
}

// Winter
function snow() { layer('<div class="snow"></div><div class="snow s2"></div>').classList.add('m-win'); device.querySelector('.fx.m-win').style.background = 'none'; }
function frost() {
  const c = screen.querySelector('.frost canvas'), box = c.parentElement;
  const r = box.getBoundingClientRect(); c.width = r.width; c.height = r.height;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, c.width, c.height); g.addColorStop(0, 'rgba(225,238,250,.94)'); g.addColorStop(1, 'rgba(200,220,240,.9)');
  x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 260; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * .6})`; x.beginPath(); x.arc(Math.random() * c.width, Math.random() * c.height, Math.random() * 2.2, 0, 7); x.fill(); }
  x.globalCompositeOperation = 'destination-out';
  let down = false;
  const wipe = e => { const b = c.getBoundingClientRect(); const px = (e.clientX - b.left) * c.width / b.width, py = (e.clientY - b.top) * c.height / b.height; const rg = x.createRadialGradient(px, py, 0, px, py, 34); rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = rg; x.beginPath(); x.arc(px, py, 34, 0, 7); x.fill(); box.querySelector('.wipe').style.opacity = 0; };
  c.addEventListener('pointerdown', e => { down = true; c.setPointerCapture(e.pointerId); wipe(e); });
  c.addEventListener('pointermove', e => { if (down || e.pointerType === 'mouse') wipe(e); });
  c.addEventListener('pointerup', () => down = false);
}

// Summer palm shadow
function palm() { layer(`<div class="palm">${[0, 35, 70, 110, 150, 195].map(a => `<i style="transform:rotate(${a}deg)"></i>`).join('')}</div>`).classList.add('m-sum'); device.querySelector('.fx.m-sum').style.background = 'none'; }

// Printer percentage counter
function printPct(card) {
  const pct = card.querySelector('.pct'), bed = card.querySelector('.bed'); if (!pct) return;
  bed.style.setProperty('--h', `${bed.clientHeight}px`);
  if (reduce) { pct.textContent = '100%'; return; }
  const delay = parseFloat(getComputedStyle(card).getPropertyValue('--d')) || 0, t0 = performance.now() + delay;
  const tick = now => { const p = Math.max(0, Math.min(1, (now - t0) / 1600)); pct.textContent = `${Math.round(p * 100)}%`; if (p < 1) requestAnimationFrame(tick); else pct.textContent = '✓ تم'; };
  requestAnimationFrame(tick);
}

// ---------- the printed book ----------
function buildBook(root, mini) {
  const bk = root.querySelector('.bk');
  const pages = [];
  pages.push(`<div class="pg cover"><div class="frame"><small>منذ ١٩٦٨</small><h1>مطعم<br>بغداد</h1><p>قائمة الطعام</p><div class="tap">دوس حتى تفتح الكتاب</div></div></div>`);
  const secPage = {};
  const chunks = [];
  MENU.forEach(s => { for (let i = 0; i < s.items.length; i += 4) chunks.push({ s, items: s.items.slice(i, i + 4), first: i === 0 }); });
  let pn = 2;
  chunks.forEach(c => { if (c.first) secPage[c.s.id] = pn; pn++; });
  pages.push(`<div class="pg"><h2>الفهرس</h2><div class="orn">◆ ◆ ◆</div><div class="idx">${MENU.map(s => `<a data-goto="${secPage[s.id]}"><span>${s.t}</span><span>${toAr(secPage[s.id])}</span></a>`).join('')}</div>
    <div class="feat"><div class="ph" ${bg(FEAT.img, 600)}></div><b>طبق البيت: ${FEAT.n}</b><div style="display:flex;justify-content:center;gap:10px;align-items:center;font-family:Cairo;font-weight:700;color:#6b1d12">${FEAT.p} <button class="add">+</button></div></div><div class="folio">١</div></div>`);
  chunks.forEach((c, i) => pages.push(`<div class="pg">${c.first ? `<h2>${c.s.t}</h2><div class="orn">◆ ◆ ◆</div>` : `<div class="orn" style="margin-top:4px">${c.s.t} · تابع</div>`}${c.items.map(it => `<div class="dish"><div class="ph" ${bg(it.img, 200)}></div><div><div class="ln">${it.n}<span>${it.p}</span></div><div class="ds"><span>${it.d}</span><button class="add">+</button></div></div></div>`).join('')}<div class="folio">${toAr(i + 2)}</div></div>`));
  bk.innerHTML = pages.join('');
  const els = [...bk.querySelectorAll('.pg')];
  els.forEach((p, i) => { p.style.zIndex = els.length - i; p.insertAdjacentHTML('beforeend', '<div class="shade"></div>'); });
  let cur = 0, busy = false;
  if (mini) { els[0].style.display = 'none'; return; }
  const turn = (i, fwd, fast) => new Promise(res => {
    const p = els[i], dur = reduce ? 1 : fast ? 260 : 700;
    if (fwd) p.style.zIndex = els.length + 5;
    const a = p.animate(fwd ? [{ transform: 'rotateY(0)' }, { transform: 'rotateY(180deg)' }] : [{ transform: 'rotateY(180deg)' }, { transform: 'rotateY(0)' }], { duration: dur, easing: fast ? 'cubic-bezier(0.77, 0, 0.175, 1)' : 'cubic-bezier(0.32, 0.72, 0, 1)', fill: 'forwards' });
    p.querySelector('.shade').animate([{ opacity: 0 }, { opacity: 1, offset: .5 }, { opacity: 0 }], { duration: dur });
    a.onfinish = () => { if (fwd) { p.style.visibility = 'hidden'; } p.style.zIndex = els.length - i; res(); };
    if (!fwd) p.style.visibility = '';
  });
  const go = async target => {
    target = Math.max(0, Math.min(els.length - 1, target));
    if (busy || target === cur) return; busy = true;
    const fast = Math.abs(target - cur) > 1;
    while (cur < target) { await turn(cur, true, fast); cur++; }
    while (cur > target) { cur--; await turn(cur, false, fast); }
    busy = false;
  };
  const onClick = e => {
    if (e.target.closest('.add')) return;
    const g = e.target.closest('[data-goto]'); if (g) return go(+g.dataset.goto);
    const d = e.target.closest('[data-dir]'); if (d) return go(cur + +d.dataset.dir);
    if (e.target.closest('.cover')) return go(1);
  };
  root.addEventListener('click', onClick);
  cleanups.push(() => root.removeEventListener('click', onClick));
  let sx = null;
  bk.addEventListener('pointerdown', e => { sx = e.clientX; });
  bk.addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 40) go(cur + (dx > 0 ? 1 : -1)); });
}
// ---------- solo: one style, full size, for the Studio showroom ----------
(() => {
  const key = new URL(location.href).searchParams.get('style');
  if (!key || !STYLES.some(s => s.key === key)) return;
  document.documentElement.classList.add('solo');
  closeApp = () => {};
  open(key);
  app.classList.add('full');
})();
