<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيوهات بشكل مختلف ٢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&family=Changa:wght@400;600;800&family=El+Messiri:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Lalezar&family=Lemonada:wght@500;700&family=Reem+Kufi:wght@400;600;700&family=Rakkas&family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #0c0c0e; color: #eee; font-family: 'Cairo', sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .gal { max-width: 1400px; margin: 0 auto; padding: 32px 16px 80px; }
  .gal h1 { font: 400 46px 'Lalezar'; }
  .gal > p { color: #b8b8c0; line-height: 1.8; margin-top: 4px; max-width: 940px; }
  .covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; margin-top: 26px; }
  .cover { border-radius: 22px; overflow: hidden; background: #18181c; border: 2px solid transparent; display: flex; flex-direction: column; }
  .cover .art { height: 300px; position: relative; overflow: hidden; cursor: pointer; }
  .cover .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .cover .fam { align-self: flex-start; font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 10px; background: #2a2a31; color: #ffd23f; }
  .cover h2 { font-size: 22px; }
  .cover p { font-size: 13.5px; color: #b8b8c0; line-height: 1.75; }
  .cover .mo { font-size: 12.5px; color: #d9d9e0; background: #222228; border-radius: 10px; padding: 8px 10px; line-height: 1.7; }
  .cover .mo b { color: #ffd23f; }
  .cover .acts { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
  .cover .open { flex: 1; background: #ffd23f; color: #111; font-weight: 900; border-radius: 12px; padding: 11px; font-size: 15px; transition: transform 140ms var(--ease-out); }
  .cover .open:active { transform: scale(.97); }

  .app { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
  .app.on { display: flex; }
  .device { width: min(430px, 100vw); height: min(900px, 100dvh); position: relative; overflow: hidden; border-radius: 34px; box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateZ(0); }
  .app.full .device { width: 100vw; height: 100dvh; border-radius: 0; }
  @media (max-width: 500px) { .device { border-radius: 0; height: 100dvh; } }
  .chrome { position: absolute; top: 10px; left: 10px; z-index: 90; display: flex; gap: 6px; }
  .chrome button { width: 38px; height: 38px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 17px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.2); }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; }
  .screen::-webkit-scrollbar, .hs::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
  .ph { background-size: cover; background-position: center; }
  .chips { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 9px 12px; }
  .chips button { flex: none; white-space: nowrap; transition: background-color 180ms ease, color 180ms ease; }
  .cart { position: sticky; bottom: 0; z-index: 30; display: flex; justify-content: space-between; align-items: center; padding: 13px 16px calc(13px + env(safe-area-inset-bottom)); font-weight: 700; }
  .odo { direction: ltr; display: inline-flex; height: 1.25em; overflow: hidden; vertical-align: bottom; }
  .odo span { display: block; transition: transform 380ms var(--ease-out); }
  .odo span i { display: block; height: 1.25em; line-height: 1.25em; font-style: normal; }
  .toast { position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%) translateY(16px); opacity: 0; z-index: 85; background: #111; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); pointer-events: none; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .add { transition: transform 120ms var(--ease-out); flex: none; }
  .add:active { transform: scale(.9); }
  .hs { display: flex; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
  .rv { opacity: 0; transform: translateY(14px); transition: opacity 400ms var(--ease-out), transform 400ms var(--ease-out); transition-delay: var(--d, 0ms); }
  .rv.in { opacity: 1; transform: none; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }


  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shine { 0%, 70% { transform: translateX(-140%) skewX(-18deg); } 100% { transform: translateX(240%) skewX(-18deg); } }
  @keyframes chase { to { background-position: 14px 0, -14px 100%, 0 14px, 100% -14px; } }
  @keyframes pop { 0% { opacity: .95; } 100% { opacity: 0; } }
  .screen .fl { will-change: transform; }
  .screen .ph { background-size: cover; background-position: center; }
  .screen .rail { position: fixed; right: 7px; top: 32%; height: 36%; width: 2px; border-radius: 2px; background: color-mix(in srgb, var(--rc) 30%, transparent); z-index: 25; pointer-events: none; }
  .screen .rail i { position: absolute; left: -3px; top: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--rc); box-shadow: 0 0 10px var(--rc); }
  .screen .hd { padding: 62px 18px 12px; }
  .screen .hd h1 { font: 400 36px 'Lalezar'; line-height: 1.15; }
  .screen .hd p { font-size: 13.5px; opacity: .85; }
  .screen .chips button { padding: 6px 13px; font-weight: 700; font-size: 13px; border-radius: 999px; }

  /* 1. APOTHECARY — wooden shelves of glass jars, each jar holding a dish behind a paper label */
  .m-apoth { --rc: #b07a3a; background: #3a2616; color: #f3e6cc; font-family: 'Cairo', sans-serif; }
  .m-apoth .hd h1 { font-family: 'Amiri'; font-weight: 700; color: #e8c88a; }
  .m-apoth .chips { background: rgba(58,38,22,.95); }
  .m-apoth .chips button { background: #e8c88a; color: #3a2616; font-family: 'Amiri'; font-size: 15px; padding: 3px 13px; }
  .m-apoth .chips button.on { background: #fff4dc; }
  .m-apoth section { padding: 12px 10px 4px; }
  .m-apoth h2 { font: 700 20px 'Amiri'; color: #e8c88a; text-align: center; margin-bottom: 4px; }
  .m-apoth .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 8px; background: repeating-linear-gradient(transparent 0 calc(var(--row, 214px) - 12px), #8a5a2b calc(var(--row, 214px) - 12px) var(--row, 214px)); }
  .m-apoth .jar { height: 214px; display: flex; flex-direction: column; align-items: center; padding-top: 6px; }
  .m-apoth .cork { width: 54%; height: 12px; border-radius: 3px 3px 0 0; background: repeating-linear-gradient(90deg, #c9a06a 0 3px, #b08452 3px 5px); }
  .m-apoth .glass { position: relative; width: 100%; height: 134px; border-radius: 12px 12px 18px 18px; overflow: hidden; padding: 5px; background: rgba(200,230,240,.18); box-shadow: inset 0 0 0 2px rgba(220,240,250,.55), inset 8px 0 14px rgba(255,255,255,.18); }
  .m-apoth .glass .ph { width: 100%; height: 100%; border-radius: 8px 8px 14px 14px; filter: saturate(.9); opacity: .92; }
  .m-apoth .glass::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: shine 6s ease-in-out var(--dl, 0s) infinite; }
  .m-apoth .lbl { position: absolute; left: 10%; right: 10%; bottom: 10px; padding: 3px 2px; background: #f6ecd2; color: #3a2616; text-align: center; border: 1px solid #8a5a2b; outline: 1px solid #f6ecd2; outline-offset: 1px; }
  .m-apoth .lbl b { display: block; font: 700 12.5px/1.15 'Amiri'; }
  .m-apoth .lbl span { font-size: 10.5px; font-weight: 700; }
  .m-apoth .add { margin-top: 8px; padding: 1px 12px; font: 700 12px 'Cairo'; background: #e8c88a; color: #3a2616; border-radius: 3px; }
  .m-apoth .cart { background: #8a5a2b; color: #fff4dc; }

  /* 2. STAMP ALBUM — perforated stamps on black mount strips; the row at the middle of the screen swells under the lens */
  .m-stamps { --rc: #2b5f8a; background: #2b5f8a; color: #1d1d1d; font-family: 'Cairo', sans-serif; }
  .m-stamps .hd { color: #fff; } .m-stamps .hd h1 { font-family: 'Reem Kufi'; font-weight: 600; }
  .m-stamps .chips { background: rgba(43,95,138,.95); }
  .m-stamps .chips button { background: #f3ecd8; color: #2b5f8a; border-radius: 3px; }
  .m-stamps .chips button.on { background: #ffd23f; color: #1d1d1d; }
  .m-stamps section { padding: 10px 10px 6px; }
  .m-stamps h2 { font: 600 18px 'Reem Kufi'; color: #fff; padding: 0 6px 4px; }
  .m-stamps .page { padding: 10px 8px; background: #f3ecd8; border-radius: 4px; box-shadow: 0 8px 18px rgba(0,0,0,.3); }
  .m-stamps .mounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; background: linear-gradient(rgba(0,0,0,.82), rgba(0,0,0,.82)) 0 18px / 100% 112px repeat-y; background-size: 100% 112px; background-image: repeating-linear-gradient(transparent 0 16px, rgba(20,20,20,.85) 16px 128px, transparent 128px 182px); }
  .m-stamps .stm { text-align: center; transform-origin: 50% 40%; }
  .m-stamps .perf { position: relative; padding: 6px 6px 4px; background: #fffdf5; mask: radial-gradient(circle 3.4px, #0000 97%, #000) -4px -4px / 9px 9px, linear-gradient(#000 0 0) 4px 4px / calc(100% - 8px) calc(100% - 8px) no-repeat; }
  .m-stamps .perf .ph { aspect-ratio: .85; box-shadow: inset 0 0 0 2px #fffdf5; }
  .m-stamps .val { position: absolute; top: 8px; inset-inline-end: 8px; font: 800 10px 'Changa'; font-style: normal; background: #b3001b; color: #fff; padding: 0 3px; }
  .m-stamps .perf b { display: block; font: 600 11.5px/1.2 'Reem Kufi'; margin-top: 3px; }
  .m-stamps .add { margin-top: 5px; padding: 0 10px; font-size: 11.5px; font-weight: 700; background: #2b5f8a; color: #fff; border-radius: 3px; }
  .m-stamps .cart { background: #13324d; color: #ffd23f; }

  /* 3. CASSETTE — a tape shell with turning reels per section, and the J-card track list under it */
  .m-cassette { --rc: #ff5a36; background: #f1e9d8; color: #1f1f1f; font-family: 'Cairo', sans-serif; }
  .m-cassette .hd h1 { font-family: 'Changa'; font-weight: 800; color: #1f1f1f; }
  .m-cassette .chips { background: rgba(241,233,216,.95); }
  .m-cassette .chips button { background: #1f1f1f; color: #f1e9d8; border-radius: 4px; }
  .m-cassette .chips button.on { background: #ff5a36; }
  .m-cassette section { padding: 12px 12px 6px; }
  .m-cassette .tape { position: relative; padding: 10px 14px 14px; border-radius: 10px; background: linear-gradient(#2a2a2a, #161616); box-shadow: 0 8px 16px rgba(0,0,0,.3); }
  .m-cassette .lab { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 12px; border-radius: 4px; background: linear-gradient(#fff 0 60%, #ff5a36 60% 72%, #ffb636 72% 84%, #fff 84%); }
  .m-cassette .lab b { font: 400 22px 'Lalezar'; } .m-cassette .lab small { font: 700 12px 'Changa'; }
  .m-cassette .win { display: flex; justify-content: space-between; align-items: center; width: 70%; margin: -14px auto 0; padding: 8px 18px; border-radius: 22px; background: #3a3a3a; box-shadow: inset 0 0 0 2px #555; position: relative; }
  .m-cassette .reel { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle, #f1e9d8 0 5px, transparent 6px), conic-gradient(#f1e9d8 0 12deg, transparent 12deg 60deg, #f1e9d8 60deg 72deg, transparent 72deg 120deg, #f1e9d8 120deg 132deg, transparent 132deg 180deg, #f1e9d8 180deg 192deg, transparent 192deg 240deg, #f1e9d8 240deg 252deg, transparent 252deg 300deg, #f1e9d8 300deg 312deg, transparent 312deg), #6b4a2a; box-shadow: 0 0 0 4px #6b4a2a; animation: spin 3s linear infinite; }
  .m-cassette .tape.ff .reel { animation-duration: .5s; }
  .m-cassette .jcard { list-style: none; margin: 8px 6px 0; padding: 6px 10px; background: #fff; border-inline-start: 8px solid #ff5a36; box-shadow: 0 3px 8px rgba(0,0,0,.12); }
  .m-cassette .jcard li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #d8cdb4; }
  .m-cassette .jcard li:last-child { border-bottom: 0; }
  .m-cassette em { font: 800 13px 'Changa'; font-style: normal; color: #ff5a36; width: 24px; }
  .m-cassette li .ph { flex: none; width: 40px; height: 40px; border-radius: 4px; }
  .m-cassette .tx { flex: 1; min-width: 0; } .m-cassette .tx b { display: block; font-size: 14px; }
  .m-cassette .tx small { display: block; font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-cassette li span { font-weight: 800; font-size: 13px; white-space: nowrap; }
  .m-cassette .add { width: 30px; height: 30px; border-radius: 50%; background: #1f1f1f; color: #fff; font-size: 11px; }
  .m-cassette .cart { background: #1f1f1f; color: #f1e9d8; }

  /* 4. OLD TICKETS — each dish a coloured ticket; the stub tears off along the perforation when ordered */
  .m-ticket { --rc: #c0392b; background: #2c2420; color: #2b1d14; font-family: 'Cairo', sans-serif; }
  .m-ticket .hd { color: #f6e4c4; } .m-ticket .hd h1 { font-family: 'Rakkas'; font-weight: 400; }
  .m-ticket .chips { background: rgba(44,36,32,.95); }
  .m-ticket .chips button { background: #f6e4c4; color: #2b1d14; border-radius: 3px; }
  .m-ticket .chips button.on { background: #e74c3c; color: #fff; }
  .m-ticket section { padding: 12px 12px 4px; }
  .m-ticket h2 { font: 400 21px 'Rakkas'; color: #f6e4c4; margin-bottom: 4px; }
  .m-ticket .tk { display: flex; margin-bottom: 8px; --pc: #f7d9a8; }
  .m-ticket .t1 { --pc: #f6c1c7; } .m-ticket .t2 { --pc: #c4e0ee; }
  .m-ticket .main, .m-ticket .stub { background: var(--pc); position: relative; }
  .m-ticket .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px 0 0 8px; mask: radial-gradient(circle 7px at 0 50%, #0000 97%, #000); }
  .m-ticket .main .ph { flex: none; width: 60px; height: 60px; border-radius: 4px; box-shadow: 0 0 0 2px rgba(43,29,20,.3); }
  .m-ticket .tx { min-width: 0; } .m-ticket .tx b { display: block; font: 400 19px/1.15 'Rakkas'; }
  .m-ticket .tx small { display: block; font-size: 11px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-ticket .stub { flex: none; width: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; border-radius: 0 8px 8px 0; border-inline-end: 3px dotted rgba(43,29,20,.45); transform-origin: 50% 0; mask: radial-gradient(circle 7px at 100% 50%, #0000 97%, #000); }
  .m-ticket .stub span { font: 800 15px 'Changa'; } .m-ticket .stub small { font-size: 10.5px; }
  .m-ticket .add { margin-top: 3px; padding: 1px 10px; font-size: 12px; font-weight: 700; background: #2b1d14; color: #f6e4c4; border-radius: 3px; }
  .m-ticket .cart { background: #e74c3c; color: #fff; }

  /* 5. FAMILY ALBUM — black pages, white-bordered prints held by paper corners, white pencil captions */
  .m-album { --rc: #e9e1cf; background: #1c1b1a; color: #e9e1cf; font-family: 'Cairo', sans-serif; }
  .m-album .hd h1 { font-family: 'Amiri'; font-weight: 700; font-style: italic; }
  .m-album .chips { background: rgba(28,27,26,.95); }
  .m-album .chips button { background: none; color: #e9e1cf; box-shadow: inset 0 0 0 1px #e9e1cf; font-family: 'Amiri'; font-size: 15px; padding: 3px 13px; }
  .m-album .chips button.on { background: #e9e1cf; color: #1c1b1a; }
  .m-album section { padding: 12px 12px 6px; }
  .m-album h2 { font: 700 italic 22px 'Amiri'; border-bottom: 1px solid #555; margin-bottom: 10px; }
  .m-album .pg { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; }
  .m-album .pic { text-align: center; rotate: var(--r); }
  .m-album .pf { position: relative; padding: 7px 7px 18px; background: #f7f3ea; box-shadow: 0 6px 12px rgba(0,0,0,.5); }
  .m-album .pf .ph { aspect-ratio: 1; filter: sepia(.35) saturate(.85) contrast(1.05); }
  .m-album .cr { position: absolute; width: 18px; height: 18px; background: #111; z-index: 1; }
  .m-album .cr.a { top: -3px; left: -3px; clip-path: polygon(0 0, 100% 0, 0 100%); } .m-album .cr.b { top: -3px; right: -3px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
  .m-album .cr.c { bottom: -3px; left: -3px; clip-path: polygon(0 0, 0 100%, 100% 100%); } .m-album .cr.d { bottom: -3px; right: -3px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .m-album .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 2; }
  .m-album .pic.got .flash { animation: pop 500ms ease-out; }
  .m-album .pic b { display: block; margin-top: 8px; font: 400 italic 15px 'Amiri'; color: #f2ecdc; }
  .m-album .add { margin-top: 3px; padding: 0 12px; font-size: 12px; color: #e9e1cf; border-bottom: 1px solid #e9e1cf; background: none; }
  .m-album .rv { transform: translateY(18px) rotate(calc(var(--r) * 3)); }
  .m-album .cart { background: #e9e1cf; color: #1c1b1a; }

  /* 6. ART DECO — black and gold, a slow sunburst, chamfered section frames, arch-topped photos two by two */
  .m-deco { --rc: #d4af37; background: #0e0e10; color: #f3e5b5; font-family: 'El Messiri', sans-serif; }
  .m-deco .sun { position: relative; overflow: hidden; text-align: center; }
  .m-deco .rays { position: absolute; left: 50%; top: 100%; width: 700px; height: 700px; margin: -350px 0 0 -350px; background: repeating-conic-gradient(rgba(212,175,55,.28) 0 5deg, transparent 5deg 15deg); border-radius: 50%; animation: spin 80s linear infinite; }
  .m-deco .hd { position: relative; } .m-deco .hd h1 { font-family: 'El Messiri'; font-weight: 700; color: #d4af37; letter-spacing: 2px; }
  .m-deco .chips { background: rgba(14,14,16,.96); border-block: 1px solid #d4af37; }
  .m-deco .chips button { background: none; color: #d4af37; border-radius: 0; font-family: 'El Messiri'; }
  .m-deco .chips button.on { background: #d4af37; color: #0e0e10; }
  .m-deco section { padding: 14px 12px 8px; }
  .m-deco .dh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .m-deco .dh b { font: 700 20px 'El Messiri'; color: #d4af37; white-space: nowrap; }
  .m-deco .gl { flex: 1; height: 7px; border-block: 1px solid #d4af37; transform-origin: 50% 50%; }
  .m-deco .gl.rv { opacity: 1; transform: scaleX(0); transition: transform 700ms cubic-bezier(0.23, 1, 0.32, 1); }
  .m-deco .gl.rv.in { transform: none; }
  .m-deco .dk { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; border: 1px solid #d4af37; clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px); background: linear-gradient(#17171a, #0e0e10); }
  .m-deco .dd { text-align: center; }
  .m-deco .arch { padding: 4px; border: 1px solid #d4af37; border-radius: 999px 999px 0 0; }
  .m-deco .arch .ph { aspect-ratio: .82; border-radius: 999px 999px 0 0; }
  .m-deco .dd b { display: block; font-size: 15px; margin-top: 6px; }
  .m-deco .dd span { font-size: 13px; color: #d4af37; letter-spacing: 1px; }
  .m-deco .add { display: block; margin: 5px auto 0; padding: 2px 14px; border: 1px solid #d4af37; color: #d4af37; background: none; font: 700 12px 'El Messiri'; }
  .m-deco .cart { background: #d4af37; color: #0e0e10; }

  /* 7. CINEMA MARQUEE — a sign of chasing bulbs per section; dishes are posters in lit glass cases */
  .m-marquee { --rc: #ffcf40; background: radial-gradient(120% 40% at 50% 0, #3a0f1a, #120408 70%); color: #fff; font-family: 'Cairo', sans-serif; }
  .m-marquee .hd h1 { font-family: 'Rakkas'; font-weight: 400; color: #ffcf40; text-shadow: 0 0 14px rgba(255,207,64,.6); }
  .m-marquee .chips { background: rgba(18,4,8,.95); }
  .m-marquee .chips button { background: #3a0f1a; color: #ffcf40; box-shadow: inset 0 0 0 1.5px #ffcf40; }

   mo: '<b>الحركة:</b> الماي يجري، والكلكات تطفو وتتمايل على الموج.',
   render: () => `
    ${rail}${hd('كلك النهر', 'كل مقطع قسم · كل كلك طبق')}
    ${chips(s => s.t)}
    ${MENU.map(s => `<section data-sec="${s.id}"><div class="bank">${s.t}</div><div class="river">${s.items.map((it, i) => `<div class="raft ${i % 2 ? 'b' : 'a'}" style="--t:${(3.4 + rnd(it.no) * 1.6).toFixed(2)}s;--dl:-${(rnd(it.no + 4) * 3).toFixed(2)}s;--r:${(1 + rnd(it.no + 2) * 1.5).toFixed(1)}deg"><div class="deck"><div class="ph" ${bg(it.img, 200)}></div><div class="tx"><b>${it.n}</b><span>${it.p}</span>${addBtn(it, 'اركب')}</div></div><i class="logs"></i></div>`).join('')}</div></section>`).join('')}
    ${cart('حمولتك')}` },

 { key: 'dengbej', fam: 'كلاسيك كردي · دەنگبێژ', name: 'الدنگبێژ',
   desc: 'الدنگبێژ هم المغنّين الكرد القدامى اللي يحچون القصص بالغناء. هنا كل قسم قصيدة، وكل طبق مقطع منها، والمقاطع يمين ويسار مثل اثنين يردّون على بعض، وصورة الطبق ميدالية مدوّرة جنب المقطع.',
   mo: '<b>الحركة:</b> موجات صوت تطلع من الميدالية اللي بنص الشاشة، مثل المغنّي اللي يغني هسه.',
   render: () => `
    ${rail}${hd('الدنگبێژ', 'كل قصيدة قسم · كل مقطع طبق')}
    ${chips(s => s.t)}
    ${MENU.map(s => `<section data-sec="${s.id}"><h2>قصيدة ${s.t}</h2>${s.items.map((it, i) => `<div class="vs rv ${i % 2 ? 'b' : 'a'}"><div class="med fl"><div class="ph" ${bg(it.img, 160)}></div></div><div class="tx"><b>${it.n}</b><p>«${it.d}» · ${it.p} دينار</p>${addBtn(it, 'اطلب')}</div></div>`).join('')}</section>`).join('')}
    ${cart('قصيدتك')}` }
);

// ---------- gallery ----------
const covers = document.getElementById('covers');
covers.innerHTML = STYLES.map(s => `
  <div class="cover">
    <div class="art" data-open="${s.key}"><div class="screen m-${s.key}" data-mini="${s.key}"></div></div>
    <div class="body"><span class="fam">${s.fam}</span><h2>${s.name}</h2><p>${s.desc}</p><div class="mo">${s.mo}</div>
      <div class="acts"><button class="open" data-open="${s.key}">افتح المنيو</button></div></div>
  </div>`).join('');
document.querySelectorAll('[data-mini]').forEach(el => {
  el.innerHTML = STYLES.find(x => x.key === el.dataset.mini).render();
  el.querySelectorAll('.rv,.pop').forEach(x => x.classList.add('in'));
  el.querySelectorAll('.lid').forEach(x => x.remove());
  el.style.cssText += ';position:absolute;top:0;right:0;width:430px;height:900px;transform:scale(var(--k));transform-origin:top right;overflow:hidden;pointer-events:none';
});
function fitMinis() { document.querySelectorAll('.art').forEach(a => a.style.setProperty('--k', a.clientWidth / 430)); }
fitMinis(); addEventListener('resize', fitMinis);

// ---------- app ----------
const app = document.getElementById('app'), device = document.getElementById('device'), screen = document.getElementById('screen'), toastEl = document.getElementById('toast');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let count = 0, total = 0, current = null, cleanups = [];
const fromAr = s => Number(s.replace(/[٠-٩]/g, d => DIG.indexOf(d)).replace(/[^\d]/g, ''));
const fmt = n => toAr(n.toLocaleString('en-US')).replace(/,/g, '٬');
const ALL = MENU.flatMap(s => s.items);

function open(key) {
  cleanups.forEach(f => f()); cleanups = [];
  device.querySelectorAll('.door').forEach(d => d.remove());
  const s = STYLES.find(x => x.key === key);
  count = 0; total = 0; current = key; lastJump = null;
  screen.className = `screen m-${key}`;
  screen.innerHTML = s.render();
  screen.scrollTo({ top: 0, behavior: 'instant' });
  app.classList.add('on'); document.body.style.overflow = 'hidden';
  wire(key);
}
function closeApp() { app.classList.remove('on', 'full'); document.body.style.overflow = ''; cleanups.forEach(f => f()); cleanups = []; }
document.getElementById('close').onclick = closeApp;
document.getElementById('full').onclick = () => app.classList.toggle('full');
app.addEventListener('click', e => { if (e.target === app) closeApp(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeApp(); });
document.addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) open(o.dataset.open); });
function toast(t) { toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('on'), 1300); }
function setOdo(n) { const d = String(Math.min(n, 99)).padStart(2, '0'); screen.querySelectorAll('.cart .odo > span').forEach((c, i) => c.style.transform = `translateY(-${Number(d[i]) * 1.25}em)`); }
function addToCart(n, p) {
  count++; total += fromAr(p);
  setOdo(count);
  screen.querySelector('.cart .sum').textContent = `${fmt(total)} د.ع ←`;
  toast(`انضاف ${n} ✓`);
}

// distance of an element from the top of the scrolling screen, whatever its offset parent
const topOf = el => el.getBoundingClientRect().top - screen.getBoundingClientRect().top + screen.scrollTop;
const mark = (sel, id) => screen.querySelectorAll(sel).forEach(b => b.classList.toggle('on', b.dataset.to === id));
const navH = () => (screen.querySelector('.chips') || { offsetHeight: 0 }).offsetHeight;
// near the end the last sections cannot reach the top, so remember what was tapped
let lastJump = null;
const jumpY = id => (lastJump = id, screen.scrollTo({ top: topOf(screen.querySelector(`[data-sec="${id}"]`)) - navH() + 2, behavior: reduce ? 'instant' : 'smooth' }));
function spyY(onChange) {
  const secs = [...screen.querySelectorAll('[data-sec]')];
  const run = () => { let cur = secs[0].dataset.sec; const off = screen.scrollTop + navH() + 60; secs.forEach(s => { if (topOf(s) <= off) cur = s.dataset.sec; }); if (lastJump && screen.scrollTop >= screen.scrollHeight - screen.clientHeight - 2) cur = lastJump; onChange(cur); };
  screen.addEventListener('scroll', run, { passive: true });
  cleanups.push(() => screen.removeEventListener('scroll', run));
  run();
}

function wire(key) {
  setOdo(0);
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { root: screen, threshold: .12 });
  screen.querySelectorAll('.rv,.pop').forEach((el, i) => { if (!el.style.getPropertyValue('--d')) el.style.setProperty('--d', `${(i % 4) * 50}ms`); io.observe(el); });
  cleanups.push(() => io.disconnect());
  const W = WIRE[key] || {};
  screen.onclick = e => {
    const a = e.target.closest('.add[data-n]');
    if (a) { e.stopPropagation(); addToCart(a.dataset.n, a.dataset.p); W.added && W.added(a); return; }
    const to = e.target.closest('[data-to]');
    if (to) return (W.go || jumpY)(to.dataset.to);
    W.click && W.click(e);
  };
  if (!W.noSpy) spyY(id => mark('.chips [data-to]', id));
  W.init && W.init();
}


const ease = 'cubic-bezier(0.23, 1, 0.32, 1)';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pulse = (el, k = 1.08) => { if (!reduce && el) el.animate([{ scale: '1' }, { scale: String(k) }, { scale: '1' }], { duration: 360, easing: ease }); };
const twirl = el => { if (!reduce && el) el.animate([{ transform: 'perspective(500px) rotateY(0)' }, { transform: 'perspective(500px) rotateY(360deg)' }], { duration: 700, easing: ease }); };
function railOn() {
  const dot = screen.querySelector('.rail i'); if (!dot) return;
  const run = () => { const m = screen.scrollHeight - screen.clientHeight; dot.style.top = `${m > 0 ? screen.scrollTop / m * 100 : 0}%`; };
  screen.addEventListener('scroll', run, { passive: true }); cleanups.push(() => screen.removeEventListener('scroll', run)); run();
}
// fn(el, d) on scroll, d = how far the element sits below the middle of the screen
function onDepth(sel, fn) {
  if (reduce) return;
  const els = [...screen.querySelectorAll(sel)]; let raf = 0;
  const run = () => { raf = 0; const sr = screen.getBoundingClientRect(), cy = sr.top + sr.height / 2; els.forEach(el => { const b = el.getBoundingClientRect(); fn(el, b.top + b.height / 2 - cy); }); };
  const on = () => { if (!raf) raf = requestAnimationFrame(run); };
  screen.addEventListener('scroll', on, { passive: true }); cleanups.push(() => { screen.removeEventListener('scroll', on); cancelAnimationFrame(raf); }); run();
}
// rows that drift sideways on their own until touched
function drift(sel) {
  if (reduce) return;
  const streams = [...screen.querySelectorAll(sel)].map(el => ({ el, dir: Number(el.dataset.dir), hold: false, x: el.scrollLeft }));
  streams.forEach(s => {
    const hold = v => () => { s.hold = v; if (!v) s.x = s.el.scrollLeft; };
    ['pointerenter', 'pointerdown', 'touchstart'].forEach(t => s.el.addEventListener(t, hold(true), { passive: true }));
    ['pointerleave', 'touchend'].forEach(t => s.el.addEventListener(t, hold(false), { passive: true }));
  });
  let raf = requestAnimationFrame(function tick() {
    streams.forEach(s => {
      if (s.hold) return;
      const max = s.el.scrollWidth - s.el.clientWidth; if (max <= 0) return;
      s.x += s.dir * .35;
      // RTL scrollLeft runs from 0 to -max; bounce at the ends
      if (s.x > 0) { s.x = 0; s.dir = -1; } if (s.x < -max) { s.x = -max; s.dir = 1; }
      s.el.scrollLeft = s.x;
    });
    raf = requestAnimationFrame(tick);
  });
  cleanups.push(() => cancelAnimationFrame(raf));
}
const got = (a, sel) => { const el = a.closest(sel); el.classList.remove('got'); void el.offsetWidth; el.classList.add('got'); };
const WIRE = {
  apoth: { added(a) { if (!reduce) a.closest('.jar').animate([{ rotate: '0deg' }, { rotate: '-7deg' }, { rotate: '5deg' }, { rotate: '-2deg' }, { rotate: '0deg' }], { duration: 520, easing: ease }); } },
  stamps: {
    // the row at the middle of the screen swells as if under a magnifying glass
    init() { onDepth('.stm', (el, d) => { el.style.transform = `scale(${(1 + Math.max(0, 1 - Math.abs(d) / 170) * .12).toFixed(3)})`; }); },
    added(a) { pulse(a.closest('.stm').querySelector('.perf'), 1.08); },
  },
  cassette: { added(a) { const t = a.closest('section').querySelector('.tape'); t.classList.add('ff'); clearTimeout(t.ff); t.ff = setTimeout(() => t.classList.remove('ff'), 1200); } },
  ticket: { added(a) { if (!reduce) a.closest('.tk').querySelector('.stub').animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(46px) rotate(16deg)', opacity: 0 }, { transform: 'none', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 1300, easing: 'ease-out' }); } },
  album: { added(a) { got(a, '.pic'); } },
  deco: { added(a) { pulse(a.closest('.dd').querySelector('.arch'), 1.05); } },
  marquee: { added(a) { got(a, '.pst'); } },
  opera: {
    // a tier's curtains open as it reaches the middle of the screen and stay open above it
    init() { onDepth('.bx', (el, d) => { el.style.setProperty('--o', clamp(1 - (d - 60) / 260, .3, 1).toFixed(3)); }); },
    added(a) { pulse(a.closest('.lodge').querySelector('.bx'), 1.06); },
  },
  manus: { added(a) { pulse(a.closest('.ent').querySelector('.mini'), 1.08); } },
  mashra: {
    // the lattice thins away near the middle
    init() { onDepth('.lat', (el, d) => { el.style.setProperty('--lat', clamp(d / 240, .08, 1).toFixed(3)); }); },
    added(a) { pulse(a.closest('.win').querySelector('.lat'), 1.04); },
  },
  arcade: { added(a) { got(a, '.arc'); } },
  carpet: { added(a) { pulse(a.closest('.dsh').querySelector('.ph'), 1.12); } },
  sadaf: {
    // each drawer slides its dish out as it reaches the middle
    init() { onDepth('.inner', (el, d) => { el.style.setProperty('--o', clamp(1 - (d - 40) / 240, .3, 1).toFixed(3)); }); },
    added(a) { pulse(a.closest('.dw').querySelector('.front'), 1.05); },
  },
  afish: { added(a) { pulse(a.closest('.post'), 1.03); } },
  bazaar: {
    // signs further down the alley are smaller and come closer as you walk
    init() { onDepth('.sg', (el, d) => { el.style.transform = `scale(${clamp(1 - d / 1400, .8, 1.06).toFixed(3)}) rotate(${clamp(d / 160, -3, 3).toFixed(2)}deg)`; }); },
    added(a) { pulse(a.closest('.bd'), 1.05); },
  },
  resmal: {
    // the tent flaps part once the top of the tent passes the lower part of the screen
    init() { onDepth('.inside', (el, d) => { el.style.setProperty('--o', clamp((150 - (d - el.offsetHeight / 2)) / 220, 0, 1).toFixed(3)); }); },
    added(a) { pulse(a.closest('.it'), 1.06); },
  },
  halay: { init() { drift('.line'); }, added(a) { pulse(a.closest('.dn').querySelector('.ph'), 1.15); } },
  khurjin: {
    // a pocket's flap lifts near the middle of the screen
    init() { onDepth('.lidk', (el, d) => { el.style.setProperty('--o', clamp(1.25 - d / 240, 0, 1).toFixed(3)); }); },
    added(a) { pulse(a.closest('.pk').querySelector('.ph'), 1.06); },
  },
  kalak: { added(a) { pulse(a.closest('.deck'), 1.04); } },
  dengbej: {
    // the bard nearest the middle of the screen is the one singing
    init() { onDepth('.med', (el, d) => { el.classList.toggle('sing', Math.abs(d) < 110); }); },
    added(a) { pulse(a.closest('.vs').querySelector('.med'), 1.1); },
  },
};
Object.values(WIRE).forEach(W => { const i = W.init; W.init = () => { railOn(); i && i(); }; });
// ---------- solo: one style, full size, for the Studio showroom ----------
(() => {
  const key = new URL(location.href).searchParams.get('style');
  if (!key || !STYLES.some(s => s.key === key)) return;
  document.documentElement.classList.add('solo');
  closeApp = () => {};
  open(key);
  app.classList.add('full');
})();
</script>
